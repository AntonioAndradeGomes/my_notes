version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      nest:
        patterns: ["@nestjs/*"]
      next:
        patterns: ["next", "react", "react-dom", "@types/react*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pub
    directory: "/apps/mobile"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
