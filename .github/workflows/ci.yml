name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # Detecta o que mudou para não rodar a suíte inteira em toda mudança.
  # ---------------------------------------------------------------------------
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docs: ${{ steps.filter.outputs.docs }}
      api-contract: ${{ steps.filter.outputs.api-contract }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            node:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            mobile:
              # Só o projeto de verdade dispara o job — mudança de README não.
              # Enquanto não houver pubspec.yaml, o job nunca roda.
              - 'apps/mobile/pubspec.yaml'
              - 'apps/mobile/lib/**'
              - 'apps/mobile/test/**'
            docs:
              - 'docs/**'
              - '**/*.md'
            api-contract:
              - 'docs/api/openapi.yaml'

  # ---------------------------------------------------------------------------
  node:
    name: Node (lint, types, testes, build)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mynotes
          POSTGRES_PASSWORD: mynotes
          POSTGRES_DB: mynotes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://mynotes:mynotes@localhost:5432/mynotes_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # o Turborepo precisa do histórico para o cache remoto

      # Sem `version`: a action lê o campo `packageManager` do package.json.
      # Passar os dois faz a action abortar com "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test -- --coverage

      - name: Build
        run: pnpm build

      - name: Publicar cobertura
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  mobile:
    name: Flutter (analyze, testes)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.1"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage

  # ---------------------------------------------------------------------------
  api-contract:
    name: Contrato OpenAPI
    needs: changes
    if: needs.changes.outputs.api-contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validar OpenAPI
        run: pnpm api:validate

  # ---------------------------------------------------------------------------
  docs:
    name: Documentação
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint de Markdown
        run: pnpm docs:lint
      - name: Verificar links quebrados
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline docs/ *.md
          fail: true
