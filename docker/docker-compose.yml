# Infraestrutura de desenvolvimento local do MyNotes.
# Uso: docker compose -f docker/docker-compose.yml up -d
name: mynotes

services:
  postgres:
    image: postgres:17-alpine
    container_name: mynotes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mynotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mynotes}
      POSTGRES_DB: ${POSTGRES_DB:-mynotes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mynotes} -d ${POSTGRES_DB:-mynotes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mynotes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mynotes-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev:latest
    container_name: mynotes-maildev
    restart: unless-stopped
    ports:
      - "1080:1080" # UI web
      - "1025:1025" # SMTP

volumes:
  postgres-data:
  redis-data:
  minio-data:
